# Copy this template to config.local.yml, then fill in your own settings.
# config.local.yml is ignored by Git. Never commit real credentials here.
HostInfo:
  IP: ""  # SSH hostname or IP address, for example ssh.example.com.
  Port: 22

UserInfo:
  Username: ""
  # Prefer SSH_SERVICE_RUNNER_PASSWORD instead of storing a password in this file.
  # An empty password preserves Paramiko's default SSH key/agent lookup.
  Password: ""

# Keywords used by the existing remote ps/grep process check.
PceKeys: []  # For example: ["my-service"]

# Remote directory containing your service scripts, for example /opt/my-service.
ServicePath: ""
StartCommand: ""  # For example: ./start.sh
StopCommand: ""  # For example: ./stop.sh
